name: cosmopipe
channels:
  - conda-forge
  - nodefaults
dependencies:
  # CosmoPower 0.2 requires TF <2.14: Python <=3.11, NumPy <=1.24.3.
  - python=3.11
  - numpy=1.24.3
  - typing_extensions<4.6
  # HMF 3.5 uses scipy.integrate.simps.
  - scipy>=1.12,<1.14
  # Matplotlib 3.11 requires NumPy >=1.25.
  - matplotlib-base>=3.10,<3.11
  - pandas>=2.3,<3
  - astropy-base>=7.2,<8
  - healpy>=1.19,<1.20
  - cosmosis=3.26
  - cosmosis-build-standard-library>=1.3
  - mpi=1.0=openmpi
  - mpi4py
  - camb
  # These conda recipes do not fully encode their PyPI NumPy requirements.
  - fast-pt>=4,<4.1
  - sacc<2
  - numexpr<2.14.2
  - h5py
  - scikit-learn
  - statsmodels
  - seaborn
  - palettable
  - mpmath
  - fitsio
  - pyarrow
  - pybind11
  - cython
  - compilers
  - gsl
  - fftw
  - cfitsio
  - make
  - bash
  - gawk
  - git
  - rsync
  - wget
  - sed
  - pkg-config
  - r-base
  - r-remotes
  - r-data.table
  - r-plotrix
  - r-rcolorbrewer
  - r-kernsmooth
  - r-itertools
  - r-matrixstats
  - r-argparser
  - r-seqinr
  - pip
  - setuptools
  - wheel
  - pytest
  - pip:
      - cosmopower==0.2.0
      - tensorflow==2.13.1
      - tensorflow-probability==0.21.0
      - hmf==3.5.2
      - astropandas>=1.2.2
      - treecorr>=5.1.4
      - tabeval @ git+https://github.com/jlvdb/tabeval.git
      - wget
