.TR1_variables: #Set relevant column names to those from the TR1 data catalogues {{{
  +KEYTYPE=FLOAT
  +LINKREPL=FALSE
  +OPTIMISE=                                 #Do not optimise the number of HCs
  +CALIBWEIGHTNAME=                          #No calibration weighting 
  +PATCHLIST=TR1                             #Southern patch only 
  +COSMOSIS_PATCHLIST=TR1                    #Run prepare for all available patches 
  +DATATHRESHOLD="-1e99 Inf"                 #Thresholds for valid flux measurements 
  +NTHREADS=258                              #Number of threads 
  +FEATURETYPES=REFRATIO                     #Features to use for the SOM construction
  +NSOM_GOLDWEIGHT=1                         #number of SOMs for goldweight calculation
  +ZPHOTNAME=PHZ_MODE_1                      #Photo-z name 
  +RANAME=RIGHT_ASCENSION                    #RA variable name 
  +DECNAME=DECLINATION                       #DEC variable name 
  +SHAPETYPE=@BV:SHAPETYPE@ 
  +RAWE1NAME=SHE_@BV:SHAPETYPE@_E1           #Raw E1 variable name (for TR1)
  +RAWE2NAME=SHE_@BV:SHAPETYPE@_E2           #Raw E2 variable name (for TR1)
  +XNAME=SHE_PSF_FOV_X                       #X variable name (for TR1)
  +YNAME=SHE_PSF_FOV_Y                       #Y variable name (for TR1)
  +WEIGHTNAME_GC=                            #Weightname for photometric clustering 
  +WEIGHTNAME_WL=SHE_@BV:SHAPETYPE@_WEIGHT   #Weightname for WL 
  +E1NAME=SHE_@BV:SHAPETYPE@_E1_CORRECTED    #E1 variable name (for TR1)
  +E2NAME=SHE_@BV:SHAPETYPE@_E2_CORRECTED    #E2 variable name (for TR1)
  +PSFE1NAME=SHE_@BV:SHAPETYPE@_PSF_E1       #PSF E1 variable name 
  +PSFE2NAME=SHE_@BV:SHAPETYPE@_PSF_E2       #PSF E2 variable name 
  +SNRNAME=model_SNratio                     #Signal-to-noise name 
  +ADDITIONALFLAGS=                          #Do not compute true biases (because we can't!)
  +NXIPM=9                                   #Number of XIPM theta bins 
  +NXIEB=20                                  #Number of XIEB theta bins 
  +NITER=4000                                #Number of iterations in SOM construction 
  +NCLUSTER=8000                             #Number of clusters for SOM cell assignment 
  +RADIUS=1                                  #Radius for on-sky matching (arcsec)
  +TOPOLOGY=rectangular                      #What topology do we want: hexagonal or rectangular 
  +TOROIDAL=                                 #Do we want a toroidal SOM? Empty = planar 
  +UNWHITEN_FEATURES=--no.whiten.features    #Do we want to whiten the SOM features? Empty = whiten 
#}}}
.TR1_wide_variables: #{{{
  +KEYTYPE=FLOAT
  +MTYPE=UNIF                                #APERTURE TYPE FOR MER FLUXES 
  +FLUXLIST="FLUX_G_EXT_DECAM_@BV:MTYPE@ FLUX_R_EXT_DECAM_@BV:MTYPE@ FLUX_I_EXT_DECAM_@BV:MTYPE@ FLUX_Z_EXT_DECAM_@BV:MTYPE@ FLUX_Y_@BV:MTYPE@ FLUX_J_@BV:MTYPE@ FLUX_H_@BV:MTYPE@"
  +REFFLUXNAME=FLUX_VIS_@BV:MTYPE@           #Name of the reference flux
  +WIDEFILT="@BV:REFFLUXNAME@ @BV:FLUXLIST@"
  +SOMDIM="61 61"                            #Wide SOM dimension 
  +WIDESOM_DIM=@BV:SOMDIM@                   #Wide SOM dimension 
  get_features_flux                          #Add the SOM feature list variable to the data block
#}}}
#}}}

#Preparation {{{
.load_and_prep_TR1_wide_magcut_abd: #Prepare the wide catalogue {{{
  .TR1_wide_variables           #Use the wide columns 
  +INPUTS=@BV:WIDECAT@
  add_head
  .ensure_ldac
  .convert_abd_fluxes_to_Jy
  +FILTERCOND=(FLUX_VIS_@BV:MTYPE@>0.000000575)
  ldacfilter                      #Filter the catalogues
  !wide_cat

#}}}
.add_null_shears: #Add zero-detector-shear and zero-WCS-shear signals {{{
  %wide_cat-wide_tmp
  @wide_tmp
  +JACOBIANS=/net/home/fohlen14/awright/Euclid/TR1_v1.1/intermediate_cats/euclid_tr1_ad_v1.1_24130_seqnr.parquet
  #Add zero-WCS-shear columns #{{{
  +CALCCOND=SHE_LENSMC_E1*0.0
  +CALCCOLNAME=ZEROSHEARWCS_E1              #Name the column
  +CALCCOMM="WCS zero-shear ellipticity"    #Comment for the new column
  ldaccalc
  +CALCCOND=SHE_LENSMC_E2*0.0
  +CALCCOLNAME=ZEROSHEARWCS_E2              #Name the column
  +CALCCOMM="FoV zero-shear ellipticity"    #Comment for the new column
  ldaccalc
  #}}}
  #Add zero-FoV-shear columns #{{{
  +CALCCOND=SHE_LENSMC_E1*0.0
  +CALCCOLNAME=ZEROSHEARFOV_E1_FOV          #Name the column
  +CALCCOMM="FoV zero-shear ellipticity"    #Comment for the new column
  ldaccalc
  +CALCCOND=SHE_LENSMC_E2*0.0
  +CALCCOLNAME=ZEROSHEARFOV_E2_FOV          #Name the column
  +CALCCOMM="FoV zero-shear ellipticity"    #Comment for the new column
  ldaccalc
  #}}}
  #Calculate the zero-WCS-shear detector ellipticity {{{
  +E1NAME=ZEROSHEARWCS_E1
  +E2NAME=ZEROSHEARWCS_E2
  +E1DETNAME=ZEROSHEARWCS_E1_FOV
  +E2DETNAME=ZEROSHEARWCS_E2_FOV
  world_to_det    #Also outputs ZEROSHEAR_G[12]_FOV, so e_to_g isn't required 
  #}}}
  #Calculate the zero-FoV-shear WCS ellipticity {{{
  +E1NAME=ZEROSHEARFOV_E1
  +E2NAME=ZEROSHEARFOV_E2
  +E1DETNAME=ZEROSHEARFOV_E1_FOV
  +E2DETNAME=ZEROSHEARFOV_E2_FOV
  det_to_world    #Also outputs ZEROSHEAR_G[12], so e_to_g isn't required 
  #}}}
  !wide_cat
  -wide_tmp
#}}}
.wide_2d_cterm: #Apply 2D c-term {{{
  %wide_cat-wide_tmp
  @wide_tmp
  +JACOBIANS=/net/home/fohlen14/awright/Euclid/TR1_v1.1/intermediate_cats/euclid_tr1_ad_v1.1_24130_seqnr.parquet
  #Calculate the zero-shear-corrected ellipticity {{{
  +CALCCOND=SHE_LENSMC_G1_FOV-ZEROSHEARWCS_G1_FOV
  +CALCCOLNAME=SHE_LENSMC_G1_FOV_ZC         #Name the column
  +CALCCOMM="FoV zero-shear corrected G1"   #Comment for the new column
  ldaccalc
  +CALCCOND=SHE_LENSMC_G2_FOV-ZEROSHEARWCS_G2_FOV
  +CALCCOLNAME=SHE_LENSMC_G2_FOV_ZC         #Name the column
  +CALCCOMM="FoV zero-shear corrected G2"   #Comment for the new column
  ldaccalc
  #}}}
  #Compute the 2D cterm in detector coords {{{
  +E1NAME=SHE_LENSMC_G1_FOV_ZC
  +E2NAME=SHE_LENSMC_G2_FOV_ZC
  correct_2D_cterm 
  #}}}
  #Apply the c-correction to the detector shears {{{
  +CALCCOND=SHE_LENSMC_G1_FOV-c1_2D_mean
  +CALCCOLNAME=SHE_LENSMC_G1_FOV_C_CORRECTED  #Name the column
  +CALCCOMM="FoV c-corrected G1"   #Comment for the new column
  ldaccalc
  +CALCCOND=SHE_LENSMC_G2_FOV-c2_2D_mean
  +CALCCOLNAME=SHE_LENSMC_G2_FOV_C_CORRECTED #Name the column
  +CALCCOMM="FoV ccorrected G2"   #Comment for the new column
  ldaccalc
  #}}}
  #compute the ellipticities {{{
  +E1NAME=SHE_LENSMC_E1_FOV_C_CORRECTED
  +E2NAME=SHE_LENSMC_E2_FOV_C_CORRECTED
  +G1NAME=SHE_LENSMC_G1_FOV_C_CORRECTED
  +G2NAME=SHE_LENSMC_G2_FOV_C_CORRECTED
  convert_g_to_e
  #}}}
  #convert the shears back to WCS coordinates {{{
  +E1DETNAME=SHE_LENSMC_E1_FOV_C_CORRECTED
  +E2DETNAME=SHE_LENSMC_E2_FOV_C_CORRECTED
  +E1NAME=SHE_LENSMC_E1_C_CORRECTED
  +E2NAME=SHE_LENSMC_E2_C_CORRECTED
  det_to_world
  #}}}
  !wide_cat 
  -wide_tmp
#}}}
.wide_main_selection: #Flag and remove duplicated objects from abd catalogue {{{
  %wide_cat-wide_tmp
  @wide_tmp
  +FILTERCOND="(MAIN_SOURCE=1)" 
  ldacfilter                      #Only keep good sources   
  !wide_cat 
  -wide_tmp
#}}}
.convert_flux_to_Jy: #Convert one flux column from uJy to Jy {{{
  +CALCCOND=FLUX_@BV:BAND@_@BV:MTYPE@          #Copy the uJy flux column
  +CALCCOLNAME=FLUX_@BV:BAND@_@BV:MTYPE@_uJy        #Name the temporary column
  +CALCCOMM="@BV:BAND@ flux in uJy"            #Comment for the temp column 
  ldaccalc                                     #Compute the new column 
  +CALCCOND=FLUX_@BV:BAND@_@BV:MTYPE@_uJy*0.000001  #Calc the Jy flux column
  +CALCCOLNAME=FLUX_@BV:BAND@_@BV:MTYPE@            #Name the temporary column
  +CALCCOMM="@BV:BAND@ flux in Jy"             #Comment for the temp column 
  ldaccalc                                     #Compute the new column 
#}}}
.convert_abd_fluxes_to_Jy: #Convert all flux bands from uJy to Jy {{{
  +BAND=VIS
  .convert_flux_to_Jy
  +BAND=G_EXT_DECAM
  .convert_flux_to_Jy
  +BAND=I_EXT_DECAM
  .convert_flux_to_Jy
#}}}
#}}}

#TR1 {{{
.compute_one_bmode_lensmc: #{{{
  #Prepare the data {{{
  +CHAINSUFFIX=lensmc
  +STATISTIC=cosebis
  +SURVEYMASKFILE_TR1=/net/home/fohlen14/awright/Euclid/TR1/EUC_LE3_COVERAGE_TR1-R1-NOBADAOCS_20250714T134732.590089Z_00.00.fits
  @cosmosis_xipm_lensmc !cosmosis_xipm
  @cosmosis_neff_lensmc !cosmosis_neff
  @cosmosis_sigmae_lensmc !cosmosis_sigmae
  @cosmosis_nz_wl_lensmc !cosmosis_nz
  @nz_WL_lensmc_C2020_sel_pv !nz
  #}}}

  #Calculate cosebis {{{
  @xipm_lensmc                              #Set the treecorr xipm to the DATAHEAD 
  calculate_cosebis                          #Compute cosebis from the xipm 
  make_data_vector_allstats 
  %cosebis_vec_TR1-cosebis_vec
  #}}}
  @
  #(covariance_cosebis_lensmc) cosebis covariance {{{
  covariance_constructor  #Construct the one-covariance input file 
  run_covariance          #Run the one-covariance 
  #}}}

  #(mcmc_inp_cosebis_lensmc) Construct the lensmc MCMC input file {{{
  save_and_check_mcmc_inp_allstats          #Construct the cosmosis input fits file
  #}}}

  #Compute COSEBI lensmc Bmodes {{{
  Bmodes_pvalue
  #}}}

  #Rename products to keep {{{
  %cosebis-cosebis_lensmc_@BV:THETAMINXI@_@BV:THETAMAXXI@    #Rename to cosebis_lensmc 
  %cosebis_vec-cosebis_vec_lensmc_@BV:THETAMINXI@_@BV:THETAMAXXI@ #Rename to cosebis_vec_lensmc 
  %covariance_cosebis-!covariance_cosebis_lensmc_@BV:THETAMINXI@_@BV:THETAMAXXI@
  %mcmc_inp_cosebis-mcmc_inp_cosebis_lensmc_@BV:THETAMINXI@_@BV:THETAMAXXI@ #Rename to mcmc_inp_cosebis_lensmc
  #}}}

  #remove the cosmosis products {{{
  -cosmosis_xipm
  -cosmosis_neff 
  -cosmosis_sigmae
  -cosmosis_nz
  -nz
  #}}}
#}}}

TR1_Bmode_pipeline: #Basis pipeline for computing B-modes with a TR1 v1.1 CosmoHub catalogue {{{
  #Data variables {{{
  .TR1_data
  .TR1_variables
  +NITER=1000
  +SEED=666 
  +SPARSEFRAC=0.0001
  +NPAIRBASE=XI_@BV:SURVEY@_TR1           #Use the combined XIpm counts as fiducial
  +SURVEYAREA=@BV:SURVEYAREA_TR1@         #Use the combined area for the survey area 
  +SURVEYAREADEG=@BV:SURVEYAREADEG_TR1@   #Use the combined area for the survey area 
  +SURVEYMASKFILE=@BV:SURVEYMASKFILE_TR1@ #Use the combined mask file for the survey mask 

  +NONGAUSS=False 
  +SSC=False
  +SHAPETYPE=LENSMC
  +WEIGHTNAME_WL=SHE_LENSMC_WEIGHT   #Weightname for WL 
  +RANAME=SHE_LENSMC_RA              #RA variable name (for TR1)
  +DECNAME=SHE_LENSMC_DEC            #DEC variable name (for TR1)
  +WEIGHTNAME=SHE_LENSMC_WEIGHT
  +E1NAME=SHE_LENSMC_E1_CORRECTED    #E1 variable name (for TR1)
  +E2NAME=SHE_LENSMC_E2_CORRECTED    #E2 variable name (for TR1)
  +PSFE1NAME=SHE_LENSMC_PSF_E1       #PSF E1 variable name 
  +PSFE2NAME=SHE_LENSMC_PSF_E2       #PSF E2 variable name 
  +TOMOVAR=@BV:TOMOVAR_WL@
  #}}}

  #Wide catalogue, including per-exposure information 
  +WIDECAT=/net/home/fohlen14/awright/Euclid/TR1_v1.1/euclid_tr1_abd_v1.1_24130_fov_main.cat

  #add the Nz {{{ 
  +INPUTS=/net/home/fohlen14/awright/Euclid/CosmoPipe/work_TR1_v1.1.2_allstats/CosmoPipe_DataBlock/nz_WL_lensmc_C2020_sel_pv/
  add_head
  !nz_WL_lensmc_C2020_sel_pv
  #}}}

#Catalogue preparation {{{
  #(wide_cat) Load & preprocess the master wide catalogue {{{
  .load_and_prep_TR1_wide_magcut_abd
  .add_null_shears
  #If you want to apply an additional selection, you should add it here
  .wide_2d_cterm
  .wide_main_selection
  #}}}
#}}}

#Pre-defined parameters {{{
  @
  add_nzbias                            #(nzbias) Add preexisting Nz bias to the datablock 
  add_nzcov                             #(nzcov) Add preexisting Nz covariance matrix to the datablock 
  decorrelate_nzbias                    #(nzbias_uncorr) Compute the decorrelated Nz bias priors 
  add_mbias                             #(mbias) Add preexisting m calibration to the datablock 
  make_m_covariance                     #(cosmosis_mcov_TR1,cosmosis_mbias_TR1,cosmosis_msigma_TR1,mcov_TR1) Compute the m covariance 
  @mbias_TR1 !mbias                     #m parameters are common (and zero) in TR1
  %cosmosis_mcov_TR1-cosmosis_mcov      #m parameters are common (and zero) in TR1
  %cosmosis_mbias_TR1-cosmosis_mbias    #m parameters are common (and zero) in TR1
  %cosmosis_msigma_TR1-cosmosis_msigma  #m parameters are common (and zero) in TR1
#}}}

#WL correlation function calculation: lensmc {{{
  +SHAPETYPE=LENSMC
  +WEIGHTNAME=SHE_LENSMC_WEIGHT
  +TOMOVAR=@BV:TOMOVAR_WL@
  #(wl_lensmc_tomo) Tomographically bin WL lensmc sample {{{
  @wide_cat                       #Using the wide source catalogue 
  +FILTERCOND=(@BV:WEIGHTNAME@>0) 
  ldacfilter                      #Only keep weight > 0 sources  
  tomography                      #Tomographically bin the sources 
  !wl_lensmc_tomo                 #Save the corrected & tomographically binned catalogues 
  #}}}
  #(neff_lensmc,sigmae_lensmc) Estimate n_effective & sigmae {{{
  neff_sigmae                     #Compute the sigma_e and n_eff for the tomographic bins
  %neff_TR1-neff_lensmc
  %sigmae_TR1-sigmae_lensmc
  #}}}
  #(wl_lensmc_tc_input) Prepare treecorr {{{
  @wl_lensmc_tomo 
  prepare_treecorr                #Convert each DATAHEAD catalogue to treecorr's expected format 
  !wl_lensmc_tc_input             #Save treecorr inputs to datablock (not used, just for posterity) 
  #}}} 
  #(xipm_lensmc) Calculate xipm {{{
  calc_xi_w_treecorr      #Calculate xipm with treecor for all files in the DATAHEAD (-> xipm)
  %xipm-xipm_lensmc       #Rename xipm to xipm_lensmc 
  #}}}
#}}}

#WL data vectors: lensmc {{{
  #(cosebis_lensmc) Calculate cosebis {{{
  @xipm_lensmc               #Use the xipm
  calculate_cosebis          #Compute cosebis from the xipm 
  #}}}
  #(cosebis_vec_lensmc) Calculate binned cosebis vector {{{
  +STATISTIC=cosebis
  make_data_vector_allstats 
  %cosebis-cosebis_lensmc    #Rename to cosebis_lensmc 
  %cosebis_vec_TR1-cosebis_vec_lensmc #Rename to cosebis_vec_lensmc 
  #}}}
#}}}

  #(cosmosis_{neff,sigmae,xipm}_lensmc, cosmosis_nz_wl_lensmc) Prepare cosmosis files {{{
  @neff_lensmc !neff_TR1                       #Use the lensmc n_effective 
  @sigmae_lensmc !sigmae_TR1                   #Use the lensmc sigmae 
  @xipm_lensmc        
  prepare_cosmosis                             #Construct input files needed by COSMOSIS
  %cosmosis_neff_TR1-cosmosis_neff_lensmc      #Rename to cosmosis_neff_lensmc 
  %cosmosis_sigmae_TR1-cosmosis_sigmae_lensmc  #Rename to cosmosis_sigmae_lensmc 
  %cosmosis_xipm_TR1-cosmosis_xipm_lensmc      #Rename to cosmosis_xipm_lensmc 
  @nz_WL_lensmc_C2020_sel_pv !nz_TR1           #Use the lensmc Nz 
  @cosmosis_neff_lensmc !cosmosis_neff         #Use the lensmc neff 
  make_cosmosis_nz                             #Construct the cosmosis nz file 
  %cosmosis_nz_TR1-cosmosis_nz_wl_lensmc       #Rename to cosmosis_nz_wl_lensmc
  -nz_TR1 -cosmosis_neff -neff_TR1 -sigmae_TR1 #Remove intermediate file 
  #}}}

  #Run OneCovariance for WL lensmc: cosebis {{{
  @cosmosis_xipm_lensmc !cosmosis_xipm
  @cosmosis_neff_lensmc !cosmosis_neff
  @cosmosis_sigmae_lensmc !cosmosis_sigmae
  @cosmosis_nz_wl_lensmc !cosmosis_nz
  @
  #(covariance_cosebis_lensmc) cosebis covariance {{{
  +STATISTIC=cosebis
  +SURVEYMASKFILE_TR1=/net/home/fohlen14/awright/Euclid/TR1/EUC_LE3_COVERAGE_TR1-R1-NOBADAOCS_20250714T134732.590089Z_00.00.fits
  covariance_constructor  #Construct the one-covariance input file 
  run_covariance          #Run the one-covariance 
  %covariance_cosebis-covariance_cosebis_lensmc 
  #}}}
  -cosmosis_xipm -cosmosis_neff -cosmosis_sigmae -cosmosis_nz 
  #}}}

  #Construct the MCMC input files for lensmc {{{
  #Assign the cosmosis products {{{
  @cosmosis_neff_lensmc !cosmosis_neff 
  @cosmosis_sigmae_lensmc !cosmosis_sigmae
  @nz_WL_lensmc_C2020_sel_pv !nz
  #}}}
  #(mcmc_inp_cosebis_lensmc) Construct the lensmc MCMC input file {{{
  +STATISTIC=cosebis
  @cosebis_vec_lensmc !cosebis_vec          #Save the data vector to a general name
  @covariance_cosebis_lensmc !covariance_cosebis  #Save the covariance to a general name 
  save_and_check_mcmc_inp_allstats          #Construct the cosmosis input fits file
  %mcmc_inp_cosebis-mcmc_inp_cosebis_lensmc #Rename to mcmc_inp_cosebis_lensmc
  -cosebis_vec -covariance_cosebis
  #}}}
  #remove the cosmosis products {{{
  -cosmosis_neff 
  -cosmosis_sigmae
  -nz
  #}}}
  #}}}
  
  #Compute lensmc Bmodes {{{
  +CHAINSUFFIX=lensmc
  +STATISTIC=cosebis #{{{
  @mcmc_inp_cosebis_lensmc !mcmc_inp_cosebis
  Bmodes_pvalue
  -mcmc_inp_cosebis
  #}}}
  #}}}


#---- Looping b-mode computation 

  +THETAMINXI=0.5 +THETAMAXXI=300.0 .compute_one_bmode_lensmc
  +THETAMINXI=1.0 +THETAMAXXI=400.0 .compute_one_bmode_lensmc

#---- xiEB computations 
  +THETAMINXI=0.5
  +THETAMAXXI=700.0

  #(cosebis_dimless_lensmc) Calculate dimless cosebis {{{
  @xipm_lensmc
  calculate_cosebis_dimless
  #}}}
  #(cosebis_dimless_vec_lensmc) Calculate dimless cosebis vector {{{
  +STATISTIC=cosebis_dimless
