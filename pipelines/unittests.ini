#
# CosmoPipe processing-function unit tests.
#
# Run with:
#   bash configure.sh tomography_unittest
#   bash tomography_unittest_pipeline.sh
#

unittests: # Run every configured processing-function unit test {{{
  .tomography_unittest
  .ldacfilter_unittest
  .ldacrenkey_unittest
  .combine_patch_unittest
  .construct_som_unittest
#}}}

tomography_unittest: # Run the tomography processing-function unit test {{{
  .tomography_unittest
#}}}

.tomography_unittest: # Validate tomographic bin assignments with a deterministic LDAC fixture {{{
  +TOMOVAR=TEST_Z
  +TOMOLIMS='0.0 0.5 1.0 2.0'
  create_tomography_unittest_catalogue
  tomography
  test_tomography
#}}}

ldacfilter_unittest: # Run the LDAC-filter processing-function unit test {{{
  .ldacfilter_unittest
#}}}

.ldacfilter_unittest: # Validate LDAC filtering with a deterministic LDAC fixture {{{
  +FILTERCOND='(TEST_Z>0.0)&(TEST_Z<=1.0)'
  +LDACFILTER_TEST_EXPECTED_IDS='3 4 5 6'
  create_tomography_unittest_catalogue
  ldacfilter
  test_ldacfilter
#}}}

ldacrenkey_unittest: # Run the LDAC rename-key processing-function unit test {{{
  .ldacrenkey_unittest
#}}}

.ldacrenkey_unittest: # Validate LDAC column renaming with a deterministic fixture {{{
  +OLDKEY=TEST_Z
  +NEWKEY=TEST_Z_RENAMED
  create_tomography_unittest_catalogue
  ldacrenkey
  test_ldacrenkey
#}}}

combine_patch_unittest: # Run the combine-patch processing-function unit test {{{
  .combine_patch_unittest
#}}}

.combine_patch_unittest: # Validate patch combination with deterministic LDAC fixtures {{{
  +PATCHLIST='A B'
  +INPUTS=unit_test_fixtures/combine_patch
  create_combine_patch_unittest_catalogues
  add_head
  convert_to_ldac
  combine_patch
  test_combine_patch
#}}}

construct_som_unittest: # Run the construct-SOM processing-function unit test {{{
  .construct_som_unittest
#}}}

.construct_som_unittest: # Validate SOM construction with a deterministic fixture {{{
  +INPUTS=unit_test_fixtures/construct_som
  +SOM_TEST_XDIM=2
  +SOM_TEST_YDIM=2
  +SOMDIM='2 2'
  +SOMFEATURES='TEST_FEATURE_1 TEST_FEATURE_2 TEST_FEATURE_3'
  +ZPHOTNAME=TEST_ZPHOT
  +ZSPECNAME=TEST_ZSPEC
  +NITER=10
  +NTHREADS=1
  +DATATHRESHOLD='-1e99 Inf'
  +TOPOLOGY=rectangular
  +TOROIDAL=--nontoroidal
  +UNWHITEN_FEATURES=--no.whiten.features
  +CALIBWEIGHTNAME=
  +SPARSEFRAC=
  +ADDITIONALFLAGS=
  create_construct_som_unittest_catalogue
  add_head
  convert_to_ldac
  construct_som
  test_construct_som
#}}}
